services:
  - type: web
    name: crt-scanner-v1-webhook
    runtime: python
    plan: free
    rootDir: crt_scanner_v1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crt-scanner-v1-db
          property: connectionString
      - key: TV_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: crt-scanner-v1-dashboard
    runtime: python
    plan: free
    rootDir: crt_scanner_v1
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crt-scanner-v1-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-luna

databases:
  - name: crt-scanner-v1-db
    plan: free
    databaseName: crt_scanner_v1
    user: crt_scanner_v1
